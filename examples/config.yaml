# Design example, not a deployable configuration. Values require implementation
# and integration validation. ${NAME} expansion is strict: missing vars fail startup.
http:
  listen: ":8080"
  max_request_bytes: 1048576
  max_wait_ms: 20000
  sse_buffer_events: 128
  disconnect_grace_ms: 5000

database:
  dsn: "${CLX_DATABASE_DSN}"
  max_connections: 20
  statement_timeout_ms: 2000
  lock_timeout_ms: 500

identity:
  issuer: "https://id.complynx.net"
  audience: "${CLX_ZITADEL_AUDIENCE}"
  client_id: "${CLX_ZITADEL_CLIENT_ID}"
  client_secret: "${CLX_ZITADEL_CLIENT_SECRET}"
  refreshable_exchange_enabled: false # Enable only after the installed-version gate.
  encryption_key_file: "/run/secrets/clx-auth-key"
  encryption_key_id: "key-v1"
  permissions_cache_ttl_seconds: 30
  jwks_cache_ttl_seconds: 300

discovery:
  docker_api: "http://docker-api-proxy:2375"
  label: "clx.harness.service"
  allowed_networks: ["agent-net"]
  poll_seconds: 60
  freshness_ttl_seconds: 300
  max_manifest_bytes: 1048576
  request_timeout_ms: 3000
  dynamic_cache_ceiling_seconds: 60

providers:
  primary:
    endpoint: "${CLX_MODEL_ENDPOINT}"
    api_key: "${CLX_MODEL_API_KEY}"

artifacts:
  root: "/data/artifacts"
  max_upload_bytes: 20971520
  quota_per_user_bytes: 1073741824

sandbox:
  engine_candidate: "goja"
  max_workers: 4
  memory_ceiling_bytes: 134217728
  pids_ceiling: 32
  script_timeout_ceiling_ms: 30000
  parallel_rpc_ceiling: 8
  cleanup_ms: 100

execution:
  lease_seconds: 15
  heartbeat_seconds: 3
  shutdown_target_ms: 1000
  shutdown_deadline_ms: 5000
  active_runs_per_user_ceiling: 4
  active_runs_total_ceiling: 32
  recovery_retry_window_seconds: 86400

# Seeded into the database only when no settings revision exists.
# These are proposals; model capability and pricing must be configured before runs.
bootstrap_settings:
  model_catalog: []
  default_model_id: null
  tariffs: []
  user_active_run_limit: 2
  run_active_time_seconds: 600
  run_lifetime_seconds: 604800
  input_wait_seconds: 86400
  approval_wait_seconds: 900
  paused_wait_seconds: 604800
  script_timeout_ms: 10000
  parallel_rpc_limit: 4
  context_input_token_budget: 16000
  output_token_limit: 4000
  regex_pattern_max_chars: 256
  regex_scan_max_bytes: 1048576
  regex_deadline_ms: 500
  history_retention: {mode: "duration", days: 365}
  artifact_retention: {mode: "duration", days: 365}
  trace_retention: {mode: "duration", days: 30}
  external_disclosure_default: false

observability:
  log_level: "info"
  log_payloads: false
