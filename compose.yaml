# Local development; real issuer and model configuration remains required.
name: clx-scripter-dev
services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    platform: linux/amd64
    environment:
      POSTGRES_DB: clx
      POSTGRES_USER: clx
      POSTGRES_PASSWORD: ${CLX_DEV_DB_PASSWORD:?Set CLX_DEV_DB_PASSWORD}
    ports: ["127.0.0.1:54329:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clx -d clx"]
      interval: 2s
      timeout: 2s
      retries: 30
  migrate:
    profiles: [app]
    build: .
    platform: linux/amd64
    command: ["migrate"]
    environment:
      CLX_CONFIG: /etc/clx/config.yaml
      CLX_DATABASE_DSN: postgres://clx:${CLX_DEV_DB_PASSWORD:?Set CLX_DEV_DB_PASSWORD}@postgres:5432/clx?sslmode=disable
    env_file:
      - path: ./deploy/api.env
        required: false
    volumes: ["${CLX_CONFIG_PATH:-./deploy/config.yaml}:/etc/clx/config.yaml:ro"]
    depends_on:
      postgres: {condition: service_healthy}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
  docker-api-proxy:
    profiles: [app]
    build: .
    platform: linux/amd64
    user: "0:0"
    command: ["docker-proxy", "--listen", ":2375", "--socket", "/var/run/docker.sock"]
    volumes: ["${CLX_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 16
    mem_limit: 64m
    cpus: 0.5
    stop_grace_period: 2s
  sandbox:
    profiles: [app]
    build: .
    platform: linux/amd64
    command: ["sandbox-supervisor", "--socket", "/run/clx-sandbox/sandbox.sock", "--max-workers", "4", "--worker-executable", "/usr/local/bin/clx-scripter", "--cleanup-timeout", "100ms"]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 32
    mem_limit: 128m
    cpus: 1.0
    volumes: ["sandbox-socket:/run/clx-sandbox"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    stop_grace_period: 5s
  api:
    profiles: [app]
    build: .
    platform: linux/amd64
    command: ["serve"]
    environment:
      CLX_CONFIG: /etc/clx/config.yaml
      CLX_DATABASE_DSN: postgres://clx:${CLX_DEV_DB_PASSWORD:?Set CLX_DEV_DB_PASSWORD}@postgres:5432/clx?sslmode=disable
    env_file:
      - path: ./deploy/api.env
        required: false
    volumes:
      - ${CLX_CONFIG_PATH:-./deploy/config.yaml}:/etc/clx/config.yaml:ro
      - ${CLX_AUTH_KEY_FILE:-./deploy/auth.key}:/run/secrets/clx-auth-key:ro
      - sandbox-socket:/run/clx-sandbox:ro
      - artifacts:/data/artifacts
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      sandbox: {condition: service_started}
      docker-api-proxy: {condition: service_started}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 512m
    cpus: 2.0
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
    stop_grace_period: 5s
volumes:
  postgres-data:
  sandbox-socket:
  artifacts:
