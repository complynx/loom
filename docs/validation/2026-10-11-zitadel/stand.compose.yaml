services:
  db:
    image: postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    container_name: clx-zitadel-qa-db-20261011
    ports: ["127.0.0.1:15433:5432"]
    environment:
      POSTGRES_PASSWORD: ${QA_POSTGRES_PASSWORD}
    networks: [qa]
  zitadel:
    image: ghcr.io/zitadel/zitadel@sha256:f3738fd984131d3f02e386d37fa480d1a30e42b7d4202e2b322f12f7cf556b64
    container_name: clx-zitadel-qa-id-20261011
    command: start-from-init --masterkey ${QA_MASTERKEY} --tlsMode disabled
    ports: ["127.0.0.1:18080:8080"]
    environment:
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_EXTERNALPORT: 18080
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_DATABASE_POSTGRES_HOST: db
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${QA_POSTGRES_PASSWORD}
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: postgres
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${QA_POSTGRES_PASSWORD}
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: qa-admin
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: QA Admin
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "2027-01-01T00:00:00Z"
      ZITADEL_FIRSTINSTANCE_PATPATH: /data/admin.pat
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${QA_HUMAN_PASSWORD}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
    volumes: ["./data:/data"]
    networks: [qa]
networks:
  qa:
    name: clx-zitadel-qa-net-20261011
    ipam:
      config:
        - subnet: 10.254.250.0/24