name: Refresh Dependabot metadata

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: dependabot-refresh-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  refresh:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'dependabot/go_modules/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: read
      actions: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GOTOOLCHAIN: local
      GOWORK: 'off'
      GOENV: 'off'
    steps:
      # Always execute reviewed base scripts. Never check out the PR's code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # Do not write PR-derived caches into the privileged base scope.
      - name: Read validated module files
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/dependabot-refresh.py prepare
      - name: Refresh and verify commit pins
        run: |
          python3 scripts/dependency-lock.py --update
          python3 scripts/dependency-lock.py --check
      - name: Commit metadata and request full CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/dependabot-refresh.py publish
