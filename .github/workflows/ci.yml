name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  behavioral-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_DB: clx_test
          POSTGRES_USER: clx
          POSTGRES_PASSWORD: isolated-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clx -d clx_test"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      CLX_TEST_DATABASE_DSN: postgres://clx:isolated-ci-only@localhost:5432/clx_test?sslmode=disable
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: true
      - run: go mod verify
      - run: python3 scripts/dependency-lock.py --check
      - run: go test -race -parallel=4 -tags=integration ./...
      - name: Test pinned media CLIs in Linux worker environment
        run: >-
          docker run --rm --network host -v "$PWD:/src" -w /src
          -e CLX_TEST_DATABASE_DSN
          golang:1.27.2-alpine3.24@sha256:f92b6ef800e499660581efdabdf25d9d817a9d124eaf900924f0504e7e27e12d
          sh -c 'apk add --no-cache gcc musl-dev ffmpeg=8.1.2-r0 poppler-utils=25.12.0-r1 font-roboto=3.005-r0 font-roboto-mono=3.000-r0 >/dev/null && CGO_ENABLED=1 go test -race -parallel=4 -tags=integration ./internal/fileproc ./internal/app ./integration'
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ./cmd/loom
      - run: sh scripts/install-tools.sh
      - run: bin/golangci-lint config verify
      - run: bin/golangci-lint run --build-tags=integration ./...
      - run: bin/govulncheck ./...
      - name: Verify container build without publishing
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: |
          docker build --platform linux/amd64 --target api -t loom:ci .
          docker build --platform linux/amd64 --target file-worker -t loom:file-worker-ci .

  publish-and-deploy:
    name: Publish Docker image and request server deployment
    needs: behavioral-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: dockerhub-loom-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check that this commit is still main
        id: current
        shell: bash
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          head_sha="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          if [ "$head_sha" = "$COMMIT_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "A newer main commit exists; skip publication and deployment."
          fi
      - name: Check publishing credentials
        if: steps.current.outputs.publish == 'true'
        shell: bash
        env:
          DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          SERVER_REPO_TOKEN: ${{ secrets.SERVER_REPO_TOKEN }}
        run: |
          test -n "$DOCKER_HUB_ACCESS_TOKEN" || { echo "::error::Missing DOCKER_HUB_ACCESS_TOKEN"; exit 1; }
          test -n "$SERVER_REPO_TOKEN" || { echo "::error::Missing SERVER_REPO_TOKEN"; exit 1; }
      - name: Set up Docker Buildx
        if: steps.current.outputs.publish == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to Docker Hub
        if: steps.current.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: complynx
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Build and push Docker image
        id: image
        if: steps.current.outputs.publish == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            complynx/loom:latest
            complynx/loom:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push source-bundled file worker
        id: file-worker
        if: steps.current.outputs.publish == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: file-worker
          platforms: linux/amd64
          push: true
          tags: |
            complynx/loom:file-worker-latest
            complynx/loom:file-worker-sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=file-worker
          cache-to: type=gha,scope=file-worker,mode=max
      - name: Dispatch event to server
        if: steps.current.outputs.publish == 'true'
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.SERVER_REPO_TOKEN }}
          repository: complynx/server_configs
          event-type: updated-loom
          client-payload: >-
            {"sha":"${{ github.sha }}","image":"complynx/loom:sha-${{ github.sha }}","digest":"${{ steps.image.outputs.digest }}","file_worker_image":"complynx/loom:file-worker-sha-${{ github.sha }}","file_worker_digest":"${{ steps.file-worker.outputs.digest }}"}
