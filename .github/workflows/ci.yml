name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: true
      - run: go mod verify
      - run: sh scripts/install-tools.sh
      - run: bin/golangci-lint config verify
      - run: bin/golangci-lint run --build-tags=integration ./...
      - run: bin/govulncheck ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: true
      - run: go test -race -parallel=4 ./cmd/... ./internal/... ./migrations/...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: true
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ./cmd/loom
      - name: Verify container build without publishing
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        env:
          IMAGE: loom-ci
          REVISION: ${{ github.sha }}
        run: docker buildx bake --file docker-bake.hcl --load

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_DB: clx_test
          POSTGRES_USER: clx
          POSTGRES_PASSWORD: isolated-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clx -d clx_test"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      CLX_TEST_DATABASE_DSN: postgres://clx:isolated-ci-only@localhost:5432/clx_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: true
      - run: go test -race -parallel=4 -tags=integration ./...
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build media test runtime with shared cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: file-runtime-tests
          platforms: linux/amd64
          load: true
          tags: loom:file-runtime-tests
          cache-from: |
            type=gha,scope=media-tests
            type=gha,scope=file-worker
          cache-to: type=gha,scope=media-tests,mode=max
      - name: Test media CLIs in the built worker runtime
        run: docker run --rm --platform linux/amd64 --network host -e CLX_TEST_DATABASE_DSN loom:file-runtime-tests

  publish-and-deploy:
    name: Publish Docker image and request server deployment
    needs: [lint, test, build, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_DB: clx_test
          POSTGRES_USER: clx
          POSTGRES_PASSWORD: isolated-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clx -d clx_test"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      CLX_TEST_DATABASE_DSN: postgres://clx:isolated-ci-only@localhost:5432/clx_test?sslmode=disable
    concurrency:
      group: dockerhub-loom-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check that this commit is still main
        id: current
        shell: bash
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          head_sha="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          if [ "$head_sha" = "$COMMIT_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "A newer main commit exists; skip publication and deployment."
          fi
      - name: Check publishing credentials
        if: steps.current.outputs.publish == 'true'
        shell: bash
        env:
          DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          SERVER_REPO_TOKEN: ${{ secrets.SERVER_REPO_TOKEN }}
        run: |
          test -n "$DOCKER_HUB_ACCESS_TOKEN" || { echo "::error::Missing DOCKER_HUB_ACCESS_TOKEN"; exit 1; }
          test -n "$SERVER_REPO_TOKEN" || { echo "::error::Missing SERVER_REPO_TOKEN"; exit 1; }
      - name: Set up Docker Buildx
        id: buildx
        if: steps.current.outputs.publish == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to Docker Hub
        if: steps.current.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: complynx
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Build publication media test runtime
        if: steps.current.outputs.publish == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          target: file-runtime-tests
          platforms: linux/amd64
          load: true
          tags: loom:file-runtime-tests-publish
          cache-from: |
            type=gha,scope=media-tests
            type=gha,scope=file-worker
      - name: Test publication media runtime before pushing images
        if: steps.current.outputs.publish == 'true'
        run: docker run --rm --platform linux/amd64 --network host -e CLX_TEST_DATABASE_DSN loom:file-runtime-tests-publish
      - name: Build and push both images in parallel
        id: images
        if: steps.current.outputs.publish == 'true'
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        env:
          IMAGE: complynx/loom
          REVISION: ${{ github.sha }}
        with:
          builder: ${{ steps.buildx.outputs.name }}
          source: .
          files: docker-bake.hcl
          push: true
          set: |
            *.labels.org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            *.labels.org.opencontainers.image.revision=${{ github.sha }}
            api.cache-from=type=gha
            api.cache-to=type=gha,mode=max
            file-worker.cache-from=type=gha,scope=file-worker
            file-worker.cache-to=type=gha,scope=file-worker,mode=max
      - name: Read both published image digests
        id: digests
        if: steps.current.outputs.publish == 'true'
        shell: bash
        env:
          BUILD_METADATA: ${{ steps.images.outputs.metadata }}
        run: |
          api_digest="$(jq -er '.api["containerimage.digest"] | select(test("^sha256:[0-9a-f]{64}$"))' <<<"$BUILD_METADATA")"
          worker_digest="$(jq -er '.["file-worker"]["containerimage.digest"] | select(test("^sha256:[0-9a-f]{64}$"))' <<<"$BUILD_METADATA")"
          echo "api=$api_digest" >> "$GITHUB_OUTPUT"
          echo "file-worker=$worker_digest" >> "$GITHUB_OUTPUT"
      - name: Dispatch event to server
        if: steps.current.outputs.publish == 'true'
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.SERVER_REPO_TOKEN }}
          repository: complynx/server_configs
          event-type: updated-loom
          client-payload: >-
            {"sha":"${{ github.sha }}","image":"complynx/loom:latest","digest":"${{ steps.digests.outputs.api }}","file_worker_image":"complynx/loom:file-worker-latest","file_worker_digest":"${{ steps.digests.outputs.file-worker }}"}
